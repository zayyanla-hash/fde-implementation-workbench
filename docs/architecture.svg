<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">FDE Implementation Workbench architecture</title>
  <desc id="desc">Synthetic inputs flow through normalization, tools with bounded retries, policy and risk checks, approval, and an auditable result.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#172033}.box{fill:#f5f7fb;stroke:#52627a;stroke-width:2}.gate{fill:#fff4d6;stroke:#b7791f;stroke-width:2}.out{fill:#e6fffa;stroke:#258f82;stroke-width:2}.arrow{stroke:#52627a;stroke-width:2;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52627a"/></marker></defs>
  <rect class="box" x="20" y="105" width="175" height="90" rx="14"/><text x="107" y="140" text-anchor="middle" font-size="18" font-weight="700">Synthetic inputs</text><text x="107" y="166" text-anchor="middle" font-size="14">CSV · docs · rules</text>
  <line class="arrow" x1="195" y1="150" x2="235" y2="150"/>
  <rect class="box" x="235" y="105" width="175" height="90" rx="14"/><text x="322" y="140" text-anchor="middle" font-size="18" font-weight="700">Normalize</text><text x="322" y="166" text-anchor="middle" font-size="14">typed domain data</text>
  <line class="arrow" x1="410" y1="150" x2="450" y2="150"/>
  <rect class="box" x="450" y="105" width="175" height="90" rx="14"/><text x="537" y="140" text-anchor="middle" font-size="18" font-weight="700">Tools + retry</text><text x="537" y="166" text-anchor="middle" font-size="14">bounded recovery</text>
  <line class="arrow" x1="625" y1="150" x2="665" y2="150"/>
  <rect class="box" x="665" y="105" width="175" height="90" rx="14"/><text x="752" y="140" text-anchor="middle" font-size="18" font-weight="700">Policy + risk</text><text x="752" y="166" text-anchor="middle" font-size="14">issues as data</text>
  <line class="arrow" x1="840" y1="150" x2="880" y2="150"/>
  <rect class="gate" x="880" y="105" width="140" height="90" rx="14"/><text x="950" y="140" text-anchor="middle" font-size="18" font-weight="700">Approval</text><text x="950" y="166" text-anchor="middle" font-size="14">human gate</text>
  <line class="arrow" x1="1020" y1="150" x2="1060" y2="150"/>
  <rect class="out" x="1060" y="105" width="120" height="90" rx="14"/><text x="1120" y="140" text-anchor="middle" font-size="18" font-weight="700">Audit</text><text x="1120" y="166" text-anchor="middle" font-size="14">receipt</text>
</svg>
