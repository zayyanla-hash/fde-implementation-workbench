[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-implementation-workbench"
version = "1.0.0"
description = "AI Forward-Deployed implementation-engineering workbench: messy requirement -> audited, approval-gated workflow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
workbench = "workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workbench = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
